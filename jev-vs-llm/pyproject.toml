[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[project]
name = "jev-vs-llm"
version = "0.2.0"
description = "Same triage task, same LangGraph, interchangeable decision backends: Jev vs LLM structured output vs open-source System One."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["langgraph>=0.2", "langchain-core>=0.3", "pydantic>=2"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "openai>=1.40"]

[project.scripts]
jevllm-web = "jevllm.web.__main__:main"

[tool.uv.build-backend]
module-name = "jevllm"
