# Builds the image of every pull request as ghcr.io/<repo>:pr-<head sha>. The homelab's ArgoCD
# ApplicationSet watches open PRs and deploys that tag at https://jev-pr-<N>.brunocabado.com.
name: pr-preview
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  image:
    # Forks get a read-only token and cannot push to GHCR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5          # lowercases the image name, which GHCR requires
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=pr-${{ github.event.pull_request.head.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64                 # the homelab node is amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
