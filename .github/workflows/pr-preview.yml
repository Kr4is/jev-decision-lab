# PR preview in the homelab: add the `preview` label to a PR and it gets deployed at
# https://jev-decision-lab-pr-<N>.brunocabado.com (LAN / tailnet only). See Kr4is/homelab-gitops.
name: pr-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    uses: Kr4is/homelab-gitops/.github/workflows/pr-preview.yml@master
    permissions:
      contents: read
      packages: write
      pull-requests: write
